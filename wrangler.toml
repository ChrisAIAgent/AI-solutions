name = "aisolutions"
compatibility_date = "2025-04-01"
main = "worker.js"

[build]
command = "node scripts/build-assistant-index.js"

# Route API requests through the server-side Worker; static pages remain asset-served.
[assets]
directory = "dist"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[vars]
ASSISTANT_BASE_URL = "https://freellmapi.worldtoolx.com/v1"
ASSISTANT_MODEL = "deepseek-v4-flash"

# Local development reads this from process.env or an ignored .dev.vars file.
[secrets]
required = ["ASSISTANT_API_KEY"]
